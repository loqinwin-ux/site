<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MineSite</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="hero">
        <h1>⚡ MineSite</h1>
        <p>IP: play.example.com</p>
        <p>версия: 1.21+</p>
        <a href="#" class="btn" id="copyBtn">Копировать IP</a>
    </div>

    <div class="stats">
        <div class="card">
            <h3>Онлайн</h3>
            <p id="online">—</p>
        </div>
        <div class="card">
            <h3>Версия ядра</h3>
            <p>PMMP5</p>
        </div>
        <div class="card">
            <h3>Статус</h3>
            <p id="status">загрузка...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
