<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix PE Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glow-bg"></div>
    <div class="container">
        <div class="header">
            <svg class="logo" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <h1>PHOENIX PE</h1>
            <p class="sub">FrizMine | access tool</p>
        </div>
        
        <div class="card">
            <div class="input-group">
                <input type="text" id="nickname" placeholder="введите ник игрока" autocomplete="off">
                <button id="hackBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 9L12 15L18 9"/>
                    </svg>
                    ВЗЛОМ
                </button>
            </div>
            
            <div id="result" class="result hidden">
                <div class="loader"></div>
                <p id="resultText"></p>
            </div>
        </div>
        
        <div class="info">
            <div class="info-line">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
                <span>поддержка: Phoenix PE, FrizMine, Magma, MCPE</span>
            </div>
            <div class="info-line">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <span>база обновлена: 27.03.2026</span>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
